<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<rect width="800" height="300" fill="white"/>
<text x="20" y="25" font-family="Arial" font-size="18">Shortest duration counterexample</text>
<line x1="90" y1="45" x2="90" y2="220" stroke="#dddddd"/><text x="90" y="240" font-family="Arial" font-size="16">0</text>
<line x1="222" y1="45" x2="222" y2="220" stroke="#dddddd"/><text x="222" y="240" font-family="Arial" font-size="16">1</text>
<line x1="354" y1="45" x2="354" y2="220" stroke="#dddddd"/><text x="354" y="240" font-family="Arial" font-size="16">2</text>
<line x1="486" y1="45" x2="486" y2="220" stroke="#dddddd"/><text x="486" y="240" font-family="Arial" font-size="16">3</text>
<line x1="618" y1="45" x2="618" y2="220" stroke="#dddddd"/><text x="618" y="240" font-family="Arial" font-size="16">4</text>
<line x1="750" y1="45" x2="750" y2="220" stroke="#dddddd"/><text x="750" y="240" font-family="Arial" font-size="16">5</text>
<text x="20" y="77" font-family="Arial" font-size="16">J0</text><rect x="90" y="55" width="396" height="30" fill="#315e85"/>
<text x="20" y="132" font-family="Arial" font-size="16">J1</text><rect x="354" y="110" width="264" height="30" fill="#9d3b3b"/>
<text x="20" y="187" font-family="Arial" font-size="16">J2</text><rect x="486" y="165" width="264" height="30" fill="#315e85"/>
<text x="90" y="275" font-family="Arial" font-size="16">Red: greedy selection. Blue: optimum. Touching endpoints are compatible.</text>
</svg>
